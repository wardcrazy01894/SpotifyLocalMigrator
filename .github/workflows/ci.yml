name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile migrate.py
      - run: pipx run ruff==0.17.0 check migrate.py tests
      - run: python -m unittest discover -s tests -v
  # Stable name for the branch-protection required check. `if: always()` makes it run (and fail)
  # when a matrix leg fails or is cancelled; a skipped job would count as a passing required check.
  check:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
